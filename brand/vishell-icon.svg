<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="vishell-icon-title">
  <title id="vishell-icon-title">ViShell</title>
  <defs>
    <linearGradient id="vsh-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8352B"/><stop offset="1" stop-color="#B3150F"/></linearGradient>
    <linearGradient id="vsh-st" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE04A"/><stop offset="1" stop-color="#FFB800"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#vsh-bg)"/>
  <!-- dấu nhắc lệnh > -->
  <polyline points="76,186 136,256 76,326" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ngôi sao vàng, cùng vị trí với icon ViScript [★] -->
  <polygon points="256.0,144.0 282.5,225.5 368.2,225.5 298.9,275.9 325.4,357.5 256.0,307.1 186.6,357.5 213.1,275.9 143.8,225.5 229.5,225.5" fill="url(#vsh-st)" stroke="#FFE680" stroke-width="4" stroke-linejoin="round"/>
  <!-- con trỏ _ nhấp nháy -->
  <line x1="392" y1="350" x2="440" y2="350" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
  </line>
</svg>
