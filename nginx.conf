# ViFastSite — máy chủ tĩnh, nén + cache + health check.
# File này được mount vào /etc/nginx/conf.d/default.conf trong image nginx:alpine.
#
# Trang quản trị (/admin, /login, /logout, /track.js, /api/track) do service
# `portal` (FastAPI + SQLite) đảm nhiệm; phần còn lại vẫn là tệp tĩnh.

# Giữ nguyên giao thức mà Traefik đã thấy (https) để cookie phiên có cờ Secure.
map $http_x_forwarded_proto $vf_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name vifast.org www.vifast.org _;

    # Docker DNS: nginx được phép khởi động trước khi `portal` sẵn sàng.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $portal_upstream "http://portal:8000";

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Nén nội dung văn bản
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Header an toàn cơ bản
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Header chung cho các đường dẫn chuyển sang service quản trị.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $vf_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;

    # Beacon đo lượt truy cập + trang đăng nhập quản trị.
    location = /track.js { proxy_pass $portal_upstream$request_uri; }
    location = /api/track { proxy_pass $portal_upstream$request_uri; }
    location = /login { proxy_pass $portal_upstream$request_uri; }
    location = /logout { proxy_pass $portal_upstream$request_uri; }
    location ^~ /admin { proxy_pass $portal_upstream$request_uri; }

    # Health check cho Docker / load balancer
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # HTML không cache để cập nhật ngay
    location = /index.html {
        expires -1;
    }

    # CSS/JS cache 7 ngày (đổi tên file khi cần bust cache)
    location ~* \.(?:css|js|svg|png|jpe?g|webp|ico)$ {
        expires 7d;
        access_log off;
    }

    # Trang tĩnh; mọi đường dẫn khác trả về index.html
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
