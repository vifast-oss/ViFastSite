# ViFastSite — máy chủ tĩnh, nén + cache + health check.
# File này được mount vào /etc/nginx/conf.d/default.conf trong image nginx:alpine.

server {
    listen 80;
    listen [::]:80;
    server_name vifast.org www.vifast.org _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Nén nội dung văn bản
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Header an toàn cơ bản
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check cho Docker / load balancer
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # HTML không cache để cập nhật ngay
    location = /index.html {
        expires -1;
    }

    # CSS/JS cache 7 ngày (đổi tên file khi cần bust cache)
    location ~* \.(?:css|js|svg|png|jpe?g|webp|ico)$ {
        expires 7d;
        access_log off;
    }

    # Trang tĩnh; mọi đường dẫn khác trả về index.html
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
